Identifier: eos8lcw
Slug: antimicrobial-activity-saureus
Status: In progress
Title: Antimicrobial activity prediction against Staphylococcus aureus from 
  public ChEMBL and PubChem data
Description: Bioactivity prediction of growth inhibition in Staphylococcus 
  aureus, trained as binary (active/inactive) classifiers from publicly 
  available data in ChEMBL and PubChem. Independent models are trained on 
  multiple bioactivity datasets, corresponding to single-point (percent 
  inhibition) and dose-response (MIC) assays, among others. A ranking score is 
  provided for each model alongside a combined consensus score.
