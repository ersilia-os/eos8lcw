Identifier: eos8lcw
Slug: antimicrobial-activity-saureus
Status: Ready
Title: Antimicrobial activity prediction against Staphylococcus aureus from 
  public ChEMBL and PubChem data
Description: Predicts inhibition of Staphylococcus aureus, the most heavily screened
  bacterial pathogen in public data and the source of the largest panel in this family,
  with eighteen classifiers spanning ChEMBL and PubChem assay pools. Single-point
  and dose-response measurements are modelled separately before a quality-weighted
  consensus combines them. The breadth of underlying data makes this among the better-supported
  organisms here, though most of it concerns methicillin-susceptible strains.
